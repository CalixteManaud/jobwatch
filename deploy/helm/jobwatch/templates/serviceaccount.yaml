{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jobwatch.serviceAccountName" . }}
  labels:
    {{- include "jobwatch.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# le job n'appelle pas l'API Kubernetes : aucun token monté
automountServiceAccountToken: false
{{- end }}
