name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# moindre privilège par défaut ; chaque job n'élargit que ce dont il a besoin
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.10"
  HELM_VERSION: "v3.18.2"

jobs:
  quality:
    name: Lint, types & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github src tests

      - name: Ruff (format)
        run: uv run ruff format --check src tests

      - name: Mypy (strict)
        run: uv run mypy

      - name: Pytest + couverture (échec sous 80 %)
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Conserver les données de couverture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true
          retention-days: 7

  coverage:
    name: Badge & commentaire de couverture
    needs: quality
    # un token en lecture seule (fork, Dependabot) ne peut ni commenter ni pousser le badge
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # branche python-coverage-comment-action-data (badge)
      pull-requests: write # commentaire sur la PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - uses: py-cov-action/python-coverage-comment-action@281cb0dcb5b15d4773037d51873558fddc5a7df8 # v4.7
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint
        run: helm lint --strict deploy/helm/jobwatch

      - name: helm template (valeurs par défaut et variantes)
        run: |
          helm template jobwatch deploy/helm/jobwatch > /dev/null
          helm template jobwatch deploy/helm/jobwatch -f deploy/kind/values-kind.yaml > /dev/null
          helm template jobwatch deploy/helm/jobwatch \
            --set persistence.enabled=false \
            --set-json 'config={"notify":{"min_score":50}}' > /dev/null

  image:
    name: Image Docker (build, scan, push)
    needs: [quality, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push GHCR, utilisé uniquement sur main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nom de l'image (GHCR exige des minuscules)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jobwatch" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm "$IMAGE:$GITHUB_SHA" --version

      - name: Scan Trivy (échec sur CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Connexion à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # on pousse exactement l'image qui vient d'être scannée
      - name: Push ghcr.io/<owner>/jobwatch:<sha> et :latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
