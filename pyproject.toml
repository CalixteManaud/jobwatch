[project]
name = "jobwatch"
version = "0.1.0"
description = "Veille quotidienne des offres CDI DevOps / Cloud / Run de France Travail : digest Discord classé + CSV de suivi."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CalixteManaud" }]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Private :: Do Not Upload",
]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6.0.2",
  "rich>=13.9",
  "structlog>=25.1",
  "tenacity>=9.0",
  "typer>=0.15",
]

[project.scripts]
jobwatch = "jobwatch.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-socket>=0.7",
  "respx>=0.22",
  "ruff>=0.9",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobwatch"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "PT", "RET",
  "SIM", "PTH", "ARG", "S", "PL", "RUF",
]
ignore = [
  "PLR0913", # trop d'arguments : les fonctions d'orchestration prennent leurs dépendances
  "PLR2004", # constantes « magiques » : seuils HTTP lisibles tels quels
]
allowed-confusables = ["’", "–", "—", "·"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG", "PLR2004", "PLC0415"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --disable-socket"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["jobwatch"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
